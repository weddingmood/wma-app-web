<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#C05638" />
  <title>Hors connexion — Wedding Mood</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: Georgia, 'Times New Roman', serif;
      background: #F8FAFC; color: #1c1917; padding: 24px;
    }
    .card {
      max-width: 420px; width: 100%; background: #fff; border: 1px solid #e7e5e4;
      border-radius: 24px; padding: 32px 28px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: #FDF4EE; color: #C05638; border: 1px solid #F5D9C8;
      font-size: 12px; font-weight: 700; padding: 6px 14px; border-radius: 999px;
      font-family: system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase;
    }
    h1 { font-size: 26px; margin: 16px 0 8px; }
    p { font-size: 14px; color: #57534e; line-height: 1.6; font-family: system-ui, sans-serif; }
    button {
      margin-top: 18px; background: #C05638; color: #fff; border: 0; cursor: pointer;
      font-weight: 700; font-size: 14px; padding: 12px 26px; border-radius: 14px;
      font-family: system-ui, sans-serif;
    }
    button:hover { background: #A84429; }
    .hint { margin-top: 14px; font-size: 12px; color: #a8a29e; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Hors connexion</span>
    <h1>Connexion interrompue</h1>
    <p>Vos données locales sont conservées. Reconnectez-vous à Internet pour synchroniser vos tâches, messages, budget et jeux, puis rouvrir votre espace couple.</p>
    <button onclick="window.location.reload()">Réessayer la connexion</button>
    <p class="hint">Wedding Mood • Côte d'Ivoire</p>
  </div>
</body>
</html>
