# Configuration Nginx pour Wedding Mood sur VPS Contabo (Ubuntu 22.04 / 24.04 LTS)
# Fichier: /etc/nginx/sites-available/weddingmood.ci

# Redirection automatique HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name weddingmood.ci www.weddingmood.ci;

    # Défi Certbot Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuration HTTPS principale avec SSL et Reverse Proxy PM2
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name weddingmood.ci www.weddingmood.ci;

    # Certificats SSL (générés avec certbot certonly --nginx -d weddingmood.ci -d www.weddingmood.ci)
    ssl_certificate /etc/letsencrypt/live/weddingmood.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/weddingmood.ci/privkey.pem;

    # Protocoles et chiffrements modernes et sécurisés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Sécurité En-têtes HTTP (HSTS, Anti-Clickjacking, XSS Protection)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Taille maximale des téléversements (images de faire-part et photos jusqu'à 20 Mo)
    client_max_body_size 20M;

    # Fichiers statiques et Cache Next.js
    location /_next/static/ {
        alias /var/www/wedding-mood/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public/ {
        alias /var/www/wedding-mood/public/;
        expires 30d;
        access_log off;
    }

    # Proxy vers l'application Next.js gérée par PM2 (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Support des WebSockets et streaming temps réel
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Logs Nginx
    access_log /var/log/nginx/weddingmood_access.log;
    error_log /var/log/nginx/weddingmood_error.log;
}
