# Supabase local development configuration for Wedding Mood
# Docs: https://supabase.com/docs/guides/cli/local-development

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 15
pooler = { enabled = true, port = 54329 }

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

# Auth is handled by the Wedding Mood application itself (custom couple + admin sessions).
# Supabase Auth/Edge Functions are intentionally disabled to keep one auth system.
[auth]
enabled = false

[edge_runtime]
enabled = false

[storage]
enabled = true
file_size_limit = "20MiB"
